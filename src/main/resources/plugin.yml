name: Firearms
version: '${project.version}'
main: fi.alavesa.firearms.FirearmsPlugin
api-version: '1.21'
softdepend: [RPEngine]
description: Ray-based guns - hold-to-spray, F reload, pump-action, magazines, hitscan + projectile, pass-through blocks, packet recoil, craters, .bbmodel pack generator.
commands:
  firearms:
    description: Firearms commands
    aliases: [fa]
    usage: |
      /firearms list
      /firearms give <gun|mag|ammo id> [amount] [player]
      /firearms pack
      /firearms reload
  viewmodel:
    description: Your own first-person gun placement (offset, fov, scale) - display-mode guns, applied at once
    usage: /viewmodel [gun] offset <right> <up> <forward> | fov <n> | scale <n> | reset | show
permissions:
  firearms.use:
    default: true
  firearms.give:
    default: op
  firearms.admin:
    default: op
