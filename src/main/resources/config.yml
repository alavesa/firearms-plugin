# ================================ FIREARMS ================================
# CONTROLS:  LEFT-click = fire (SEMI: one shot per click; AUTO: hold to spray, release to stop)
#            F          = reload (magazine swap, or one round at a time for pump-action guns)
#            RIGHT-click with a MAGAZINE in hand = fill it from loose rounds in your inventory
#            Sneak      = aim (tighter accuracy, half recoil)

# The vanilla item every gun / magazine / round / crater is built on. The resource pack re-skins it
# by custom_model_data (see /firearms pack). Pick something with no right-click behaviour of its own.
item-base: BRICK

# ---- Hold-to-fire detection (AUTO guns) ----
# Minecraft's client only repeats the arm swing while it is MINING a block under the crosshair, so while an
# AUTO gun is held an invisible, unbreakable BARRIER is shown to you only, this many blocks out on your
# crosshair (you see its thin wireframe outline; the server never has it, bullets pass, nobody else sees it).
# Holding LEFT "mines" it = continuous fire; release = stop. A nearer real block is mined instead (hidden
# Mining Fatigue keeps it from cracking); an enemy under the crosshair gets the box just in front of them.
hold:
  distance: 7.0          # 0 = off (tap-fire only)
  reach-bonus: 6.0       # extra block reach while an AUTO gun is held so the barrier is reachable
  lead: 3.0              # fast camera turns: also show the cluster where the crosshair is heading
  linger-ticks: 3        # keep cells this long after the crosshair leaves them
  mining-fatigue: true   # hidden Mining Fatigue III while any gun is held (no cracks, no breaking)
  no-dip: true           # huge attack_speed while a gun is held, so the gun never dips below the screen after a click

# ---- Ballistics ----
ballistics:
  tracer: true           # dust tracer along each shot
  tracer-step: 1.5       # blocks between tracer particles
  projectile-drag: 0.06  # per-tick speed loss after the hitscan range (projectile phase)
  projectile-gravity: 0.03  # default `drop` (per-tick downward velocity gain once a bullet starts arching)
  penetration-damage: 0.9   # damage multiplier per penetrable wall layer the bullet went through (0.9 = 10% less)
  # Blocks a bullet flies THROUGH if there is only ONE layer of them (a second layer in a row stops it).
  # "#name" = a vanilla block tag, otherwise a block id.
  pass-through:
    - "#logs"
    - "#planks"
    - "#wooden_slabs"
    - "#wooden_stairs"
    - "#wooden_doors"
    - "#wooden_trapdoors"
    - "#wooden_fences"
    - "#wool"
    - "#wool_carpets"
    - IRON_BARS
    - WATER
    - LAVA
    - POWDER_SNOW
    - BARRIER
  # Bullets always pass these, any thickness (never count as a layer).
  ignore:
    - BARRIER
    - LIGHT
    - STRUCTURE_VOID

# When the server/world has PvP disabled the game cancels every player-vs-player hit, so shots register (sound,
# vest) but do no damage. With this on, bullets are forced through anyway as source-less damage. Turn it off and
# enable real PvP if you want vanilla kill credit / death messages.
bypass-pvp: true

# ---- Shell casings ----
casings:
  enabled: true
  seconds: 8             # how long a casing lies on the ground
  scale: 0.35
  max: 300               # oldest are removed first
# per gun: casing: <model> (default "casing", models/casing.bbmodel or a placeholder), eject: "right,up,forward"

# ---- First-person ARMS with the player's own skin ----
# One pack for everyone: each arm is built from one tiny quad per skin pixel, each with its own tint index, and the
# plugin writes the holder's skin colours into the gun's custom_model_data.colors (fetched from the player's
# profile; Steve colours if the skin can't be fetched, e.g. offline-mode). Only shown in first person.
# Positions are in MODEL PIXELS of the gun: pos = where the HAND end of the 4x12x4 arm box sits, the arm then
# extends 12 px "up" its own axis and is rotated about pos (one axis, 22.5 deg steps - a Java model limit).
# Override per gun in guns.yml with the same `arms:` layout. Also `arms.right.rotation`, `arms.left.rotation`.
arms:
  enabled: false         # OFF by default: model the hands in the .bbmodel itself; turn on for skin-coloured arms
  right: { enabled: true,  pos: [10.5, 1, 11.5], rotation: [-45, 0, 0] }
  left:  { enabled: false, pos: [5.5, 3, 4],      rotation: [-45, 0, 22.5] }

# ---- GUI icons ----
# In the inventory a gun shows a flat label card ("RIFLE", "SMG"...) instead of the 3D model - Roblox style. Draw your
# own as models/<model>_icon.png (any size) or let the generator render the gun's name. accent = the bar colour.
icons:
  enabled: true
  accent: "E8A33D"

# ---- Craters (bullet holes) ----
craters:
  enabled: true
  seconds: 90            # how long a crater stays
  max-per-world: 400     # oldest are removed first
  model: crater          # custom_model_data string of the crater item model (you texture it)
  size: 0.35             # display scale

# ---- Ballistic vests ----
# Worn in the chest slot. hearts = extra max health while worn; absorb = share of every bullet the vest soaks
# instead of the wearer; absorb-hearts = how many hearts of bullet damage it soaks before it is destroyed
# (its durability bar). Give with /firearms give vest_light. Icon model = .bbmodel or <model>.png in models/.
armor-base: LEATHER_CHESTPLATE
armor:
  vest_light:     { name: "&fLight Vest",     model: vest_light,     hearts: 1, absorb: 0.35, absorb-hearts: 40, color: "9AA3A8" }
  vest_ballistic: { name: "&fBallistic Vest", model: vest_ballistic, hearts: 3, absorb: 0.55, absorb-hearts: 40, color: "5E6B5A" }
  vest_heavy:     { name: "&fHeavy Vest",     model: vest_heavy,     hearts: 5, absorb: 0.75, absorb-hearts: 40, color: "3A3A40" }

# ---- Muzzle flash ----
# Two parts. (1) Baked into the fire animation frames by /firearms pack: a glowing cube at the muzzle (per gun
# `flash: x,y,z` in model pixels, default = the front/north end of the model) on the first `frames` fire frames.
# (2) A light-15 LIGHT block shown CLIENT-SIDE at the muzzle for `ticks` ticks to everyone within `range`, so the
# room lights up for a split second. The shot's tracer also starts at the muzzle (per gun `muzzle: right,up,forward`).
flash:
  frames: 1
  size: 2.5              # flash cube size in model pixels
  brightness: 0.65       # 0.1 - 1.0: texture opacity and light level of the flash
  light: true
  level: 15
  ticks: 2
  range: 32

# ---- Weight ----
weight:
  speed-per-kg: 0.012    # walk-speed penalty per kg while the gun is held (3 kg = -3.6 %)

# ---- Recoil ----
recoil:
  ticks: 3               # the kick is spread over this many ticks (packet-driven, no teleports)
  aim-multiplier: 0.5    # recoil while sneaking

# ---- Accuracy ----
accuracy:
  moving-penalty: 1.0    # extra spread (degrees) while walking
  sprint-penalty: 2.5    # extra spread while sprinting
  air-penalty: 2.0       # extra spread while off the ground

# ---- First-person animations (frames generated from .bbmodel animations by /firearms pack) ----
anim:
  frame-ticks: 1
  max-frames: 40         # cap per clip (longer animations get coarser frames) - keeps the pack small
  # If the baked whole-gun (root bone) motion comes out mirrored in first person, flip the sign per axis here.
  root-rotation-sign: [1, 1, 1]
  root-position-sign: [1, 1, 1]

# ---- Resource pack generator ----
pack:
  # pack.mcmeta: a wide min/max range so every 1.21.4+ / 26.x client accepts the pack without a warning
  min-format: 46
  max-format: 999
