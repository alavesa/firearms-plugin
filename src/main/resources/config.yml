# ================================ FIREARMS ================================
# CONTROLS:  LEFT-click = fire (SEMI: one shot per click; AUTO: hold to spray, release to stop)
#            F          = reload (magazine swap, or one round at a time for pump-action guns)
#            RIGHT-click with a MAGAZINE in hand = fill it from loose rounds in your inventory
#            Sneak      = aim (tighter accuracy, half recoil)

# Guns are built on a CROSSBOW kept permanently "charged": in third person that gives the two-handed aiming pose
# (the bolt is never loosed - the plugin cancels it). Magazines, rounds, casings, craters, grenades use item-base.
gun-item: CROSSBOW
item-base: BRICK

# ---- Hold-to-fire detection (AUTO guns) ----
# Minecraft's client only repeats the arm swing while it is MINING a block under the crosshair, so while an
# AUTO gun is held an invisible, unbreakable BARRIER is shown to you only, this many blocks out on your
# crosshair (you see its thin wireframe outline; the server never has it, bullets pass, nobody else sees it).
# Holding LEFT "mines" it = continuous fire; release = stop. A nearer real block is mined instead (hidden
# Mining Fatigue keeps it from cracking); an enemy under the crosshair gets the box just in front of them.
hold:
  distance: 7.0          # 0 = off (tap-fire only)
  reach-bonus: 6.0       # extra block reach while an AUTO gun is held so the barrier is reachable
  lead: 3.0              # fast camera turns: also show the cluster where the crosshair is heading
  linger-ticks: 3        # keep cells this long after the crosshair leaves them
  min-distance: 3.0      # a BLOCK never makes the barrier appear nearer than this (grass fields); entities may (1.2)
  mining-fatigue: true   # hidden Mining Fatigue III while any gun is held (no cracks, no breaking)
  no-dip: true           # huge attack_speed while a gun is held, so the gun never dips below the screen after a click

# ---- Ballistics ----
ballistics:
  tracer: true           # dust tracer along each shot
  tracer-step: 1.5       # blocks between tracer particles
  projectile-drag: 0.06  # per-tick speed loss after the hitscan range (projectile phase)
  projectile-gravity: 0.03  # default `drop` (per-tick downward velocity gain once a bullet starts arching)
  penetration-damage: 0.9   # damage multiplier per penetrable wall layer the bullet went through (0.9 = 10% less)
  # Blocks a bullet flies THROUGH if there is only ONE layer of them (a second layer in a row stops it).
  # "#name" = a vanilla block tag, otherwise a block id.
  pass-through:
    - "#logs"
    - "#planks"
    - "#wooden_slabs"
    - "#wooden_stairs"
    - "#wooden_doors"
    - "#wooden_trapdoors"
    - "#wooden_fences"
    - "#wool"
    - "#wool_carpets"
    - IRON_BARS
    - WATER
    - LAVA
    - POWDER_SNOW
    - BARRIER
  # Bullets always pass these, any thickness (never count as a layer).
  ignore:
    - BARRIER
    - LIGHT
    - STRUCTURE_VOID

# When the server/world has PvP disabled the game cancels every player-vs-player hit, so shots register (sound,
# vest) but do no damage. With this on, bullets are forced through anyway as source-less damage. Turn it off and
# enable real PvP if you want vanilla kill credit / death messages.
bypass-pvp: true

# ---- Getting shot ----
damage:
  hurt-animation: false   # false = no red flash / hurt wobble on the victim: health is lowered directly (lethal hits
                          # still go through the normal damage so the kill is credited). true = vanilla hurt effect.
blood:
  enabled: true
  range: 4.0             # how far behind the victim a wall can be for a splatter
  seconds: 60            # how long a splatter stays
  size: 0.7
  variants: 6            # blood_1 .. blood_N textures, picked at random: your own models/blood_N.png, or one blood.png
                         # that the pack turns, mirrors, darkens and erodes into N different stains, or generated splatters
  extra: 2               # extra splatters around the victim per hit (floor + a random direction)
  model: blood
# Hit zones: multiplier by where the bullet lands on the hitbox (height fraction). Vests do not cover the head.
damage:
  vehicle-multiplier: 1.0  # bullets vs cars/machines (their own health; no blood, no hit zones)
  zones:
    head: 3.0
    body: 1.0
    legs: 0.8
    head-from: 0.75      # top 25 % of the hitbox = head
    legs-to: 0.4         # bottom 40 % = legs

# ---- Shell casings ----
casings:
  enabled: true
  seconds: 8             # how long a casing lies on the ground
  scale: 0.35
  max: 300               # oldest are removed first
# per gun: casing: <model> (default "casing", models/casing.bbmodel or a placeholder), eject: "right,up,forward"

# ---- Hands modelled in the .bbmodel, painted with the player's skin (see docs/HANDS.md) ----
# Cubes in groups named hand/arm whose faces use a texture named skin/steve/alex/player/template are turned into one
# tinted quad per skin pixel; groups named *slim* form the slim-arm variant chosen per player automatically.
hands:
  enabled: true
  group-keywords: [hand, arm]
  texture-keywords: [skin, steve, alex, player, template]

# ---- (older) generated first-person ARMS - off by default, superseded by hands in the .bbmodel ----
# One pack for everyone: each arm is built from one tiny quad per skin pixel, each with its own tint index, and the
# plugin writes the holder's skin colours into the gun's custom_model_data.colors (fetched from the player's
# profile; Steve colours if the skin can't be fetched, e.g. offline-mode). Only shown in first person.
# Positions are in MODEL PIXELS of the gun: pos = where the HAND end of the 4x12x4 arm box sits, the arm then
# extends 12 px "up" its own axis and is rotated about pos (one axis, 22.5 deg steps - a Java model limit).
# Override per gun in guns.yml with the same `arms:` layout. Also `arms.right.rotation`, `arms.left.rotation`.
arms:
  enabled: false         # OFF by default: model the hands in the .bbmodel itself; turn on for skin-coloured arms
  right: { enabled: true,  pos: [10.5, 1, 11.5], rotation: [-45, 0, 0] }
  left:  { enabled: false, pos: [5.5, 3, 4],      rotation: [-45, 0, 22.5] }

# ---- First-person position of the gun models ----
# Where a gun sits = its display transform per display state (Blockbench's Display tab; guns.yml display:). Set it in
# game per state:  /firearms pose <gun> [first|third|gui|ground|fixed|head] offset <x> <y> <z>  (model pixels: +x =
# right, +y = up, +z = towards you) | rotate <x> <y> <z> (degrees) | scale <s> | reset;  "~" keeps a value, "~2" adds
# 2, no state = first. Saved to guns.yml, the pack is rebuilt and sent to everyone. /firearms pose <gun> lists them.
display:
  # Minecraft draws every CHARGED crossbow in first person 0.64 blocks to the left and turned 10 degrees (the
  # vanilla crossbow aiming pose). This folds the exact inverse into the gun models, so the display values mean
  # the same place they did on the brick base. Turn off if you set your display values with that pose included.
  crossbow-compensate: true

# ---- Stat sheet in the gun's description (0-10 bars; 10 = these maxima) ----
stats:
  max:
    damage: 20       # damage x pellets per trigger pull
    fire-rate: 15    # rounds per second
    spread: 6        # hip-fire spread in degrees (accuracy bar = 10 at 0 deg, 0 at this value)
    recoil: 8        # vertical kick in degrees
    range: 160       # blocks

# ---- GUI icons ----
# In the inventory a gun shows a flat label card ("RIFLE", "SMG"...) instead of the 3D model - Roblox style. Draw your
# own as models/<model>_icon.png (any size) or let the generator render the gun's name. accent = the bar colour.
icons:
  enabled: true
  accent: "E8A33D"

# ---- Grenades ----
grenades:
  smoke-density: 28      # particles per tick in a smoke cloud (higher = less see-through, more client load)
  throw-delay-ticks: 8   # the grenade never leaves the hand sooner than this after the click (lets the throw show)

# ---- Craters (bullet holes) ----
craters:
  enabled: true
  seconds: 90            # how long a crater stays
  max-per-world: 400     # oldest are removed first
  model: crater          # custom_model_data string of the crater item model (you texture it)
  size: 0.35             # display scale

# ---- Ballistic vests ----
# Worn in the chest slot. hearts = extra max health while worn; absorb = share of every bullet the vest soaks
# instead of the wearer; absorb-hearts = how many hearts of bullet damage it soaks before it is destroyed
# (its durability bar). Give with /firearms give vest_light. Icon model = .bbmodel or <model>.png in models/.
armor-base: LEATHER_CHESTPLATE
armor:
  vest_light:     { name: "&fLight Vest",     model: vest_light,     hearts: 1, absorb: 0.35, absorb-hearts: 40, color: "9AA3A8" }
  vest_ballistic: { name: "&fBallistic Vest", model: vest_ballistic, hearts: 3, absorb: 0.55, absorb-hearts: 40, color: "5E6B5A" }
  vest_heavy:     { name: "&fHeavy Vest",     model: vest_heavy,     hearts: 5, absorb: 0.75, absorb-hearts: 40, color: "3A3A40" }

# ---- Muzzle flash ----
# Two parts. (1) Baked into the fire animation frames by /firearms pack: a glowing cube at the muzzle (per gun
# `flash: x,y,z` in model pixels, default = the front/north end of the model) on the first `frames` fire frames.
# (2) A light-15 LIGHT block shown CLIENT-SIDE at the muzzle for `ticks` ticks to everyone within `range`, so the
# room lights up for a split second. The shot's tracer also starts at the muzzle (per gun `muzzle: right,up,forward`).
flash:
  frames: 1
  size: 2.5              # flash cube size in model pixels
  brightness: 0.65       # 0.1 - 1.0: texture opacity and light level of the flash
  light: true
  level: 15
  ticks: 2
  range: 32

# ---- Weight ----
weight:
  speed-per-kg: 0.012    # walk-speed penalty per kg while the gun is held (3 kg = -3.6 %)

# ---- Recoil ----
recoil:
  ticks: 3               # the kick is spread over this many ticks (packet-driven, no teleports)
  aim-multiplier: 0.5    # recoil while sneaking

# ---- Accuracy ----
accuracy:
  moving-penalty: 1.0    # extra spread (degrees) while walking
  sprint-penalty: 2.5    # extra spread while sprinting
  air-penalty: 2.0       # extra spread while off the ground

# ---- First-person animations (frames generated from .bbmodel animations by /firearms pack) ----
anim:
  # composite (default): every animated group is its own sub-model with an EXACT display transform per frame -
  #   no 22.5 degree rounding at all. baked: the older single-model mode (rotations rounded to 22.5 steps).
  mode: composite
  frame-ticks: 1         # auto frame spacing when an animation has no Blockbench snapping and no explicit frames
  max-frames: 120        # cap per clip (per gun: guns.yml anim.max-frames); a capped clip is reported by /firearms pack
  # Which animation NAMES in the .bbmodel mean which clip (exact name first, then "contains"). Add your own words,
  # e.g. "rel" for reload. Per gun: guns.yml anim-names: with the same layout.
  names:
    fire:    [fire, shoot, shot, recoil]
    reload:  [reload, rel, mag]
    equip:   [equip, draw, deploy, pull, ready]
    pump:    [pump, rack, cock, bolt, cycle]
    inspect: [inspect, look, check]   # (not "idle": an idle animation would steal the inspect clip)
  # Animation channel signs relative to the rest pose. Default "auto": Blockbench 4.x files (format_version 4.*) use
  # rotation [-1,-1,1] and position [-1,1,1] (keyframes are stored in the Bedrock convention), Blockbench 5 files [1,1,1].
  # Override with explicit lists if a model still animates mirrored:
  # rotation-sign: [-1, -1, 1]
  # position-sign: [-1, 1, 1]
  root-rotation-sign: [1, 1, 1]   # (baked mode only) extra flips for the whole-gun motion
  root-position-sign: [1, 1, 1]

# ---- Third person ----
# Every gun frame carries its pose as per-part (bone) display rotations, and those exist only in the first-person
# entries of the items file. In third person, on the ground, in item frames and in the GUI fallback the gun is its
# REST pose: no animation, no hands, no flash. animate: true puts the frames into third person as well.
third-person:
  animate: false

# ---- Flinch animations on a shot player (RP Engine emotes) ----
# Needs the RP Engine plugin. Put a player rig in plugins/Firearms/models/players/<rig>.bbmodel (BetterModel-style
# player rig: bones ph head, pc/pw/phip body, pra/prfa right arm, pla/plfa left arm, prl/prfl right leg, pll/plfl
# left leg, player_root) with animations named as below; it is mirrored into RP Engine, which makes every animation
# the emote "<rig>_<animation>". Hand-written RP Engine emotes work too (their plain id). The emote is picked by hit
# zone and the side the bullet came from, most specific first: head_left -> head -> body_left -> body.
hit-animations:
  enabled: true
  rig: player_rig
  animations:
    head: hit_head
    body: hit_body
    legs: hit_legs
    # head_left: hit_head_left   # optional side variants
    # head_right: hit_head_right
    # body_left: hit_body_left
    # body_right: hit_body_right
    # legs_left: hit_legs_left
    # legs_right: hit_legs_right

# ---- Resource pack generator ----
pack:
  include-hidden-cubes: false   # cubes hidden in Blockbench (eye icon) are left out and reported; true keeps them
  # Getting the pack to players automatically (on join and right after /firearms pack, added on top of the server's
  # other packs). mode:
  #   auto     - (default) rpengine when the RP Engine plugin is installed, else upload, and only if uploading fails
  #              fall back to the built-in server. Nothing to configure.
  #   rpengine - the pack is unpacked into plugins/RPEngine/content/firearms and RP Engine merges it into the server's
  #              one pack, hosts it and sends it (its own host.mode); /firearms pack hands it over and reloads RP Engine.
  #   self   - built-in HTTP server on `port`. The port MUST be reachable by players (open it in the firewall / hosting
  #            panel) and it can NOT be the Minecraft port - the game server owns that one. address: the host or IP
  #            players use to reach the server ("" = the address each player connected with).
  #   upload - no port to open: after every build the zip is uploaded to a public file host (catbox.moe, 0x0.st as
  #            fallback) and that link is sent. Needs internet from the server; the pack is public there (it is sent
  #            to every player anyway).
  #   url    - you host Firearms-pack.zip yourself: put its link in `url` and re-upload after each /firearms pack.
  # A failed download on a client is reported in the console and to admins with the reason. /firearms host = status.
  host:
    enabled: true
    mode: auto
    # rpengine mode: RP Engine rebuilds and zips the WHOLE merged pack inside its reload, on the main thread - the
    # server does not tick meanwhile (a big pack = many seconds; Paper's watchdog prints "has not responded" after
    # 50 s, which is not a crash). The reload is therefore batched: it runs this many seconds after the last
    # /firearms pack or pose change, so a tuning session costs one pause. 0 = at once, -1 = never from here
    # (run /rp reload yourself at a quiet time; the files are already in place).
    rpengine-reload-delay: 20
    port: 25580
    address: ""
    url: ""
    required: false
    prompt: "Firearms gun models"
  # pack.mcmeta: a wide min/max range so every 1.21.4+ / 26.x client accepts the pack without a warning
  min-format: 46
  max-format: 999
