# Guns. Every gun is ONE fixed fire mode: semi or auto.
#  model          custom_model_data string = the .bbmodel file name in plugins/Firearms/models (without .bbmodel)
#  weight         kg - walk-speed penalty while held (config weight.speed-per-kg)
#  fire-mode      semi | auto
#  fire-rate      rounds per second (auto: spray cadence; semi: the fastest you may click)
#  damage         damage dealt to whoever is shot, in HALF-hearts (4.0 = 2 hearts), at full strength (within
#                 hitscan-range); falls off to falloff-min at range; -10%/wall layer (config penetration-damage);
#                 a worn vest soaks part of it
#  magazine       rounds the gun holds
#  mag            magazine type (mags.yml) - guns can share a type. "none" = loaded round by round (pump-action)
#  ammo           round type (mags.yml ammo:) used when mag is none (pump/tube guns)
#  pump-action    true = reload one round at a time; shooting interrupts the reload and keeps what was loaded
#  reload-seconds magazine swap time (mag guns) / seconds PER ROUND (pump-action)
#  hitscan-range  blocks the shot is instant (full damage). Past it the bullet becomes a slowing projectile.
#  range          max distance the projectile can still travel/hit
#  speed          projectile speed in blocks/tick right after the hitscan range (then drag + gravity apply)
#  accuracy       hip-fire spread in degrees (0 = laser)
#  aim-accuracy   spread while sneaking
#  recoil         vertical camera kick per shot in degrees
#  h-recoil       horizontal kick, random left/right up to this many degrees
#  falloff-min    damage multiplier at max range (damage falls linearly from hitscan-range to range)
#  pellets        rounds per trigger pull (shotgun spread)
#  sound / pitch  shot sound
#  muzzle         "right,up,forward" in blocks from the eye: where the tracer + flash start (NOT inside the head)
#  flash          "x,y,z" in model pixels: where the baked muzzle-flash cube sits in the fire frames (default: front end)
#  display        optional exact first/third-person pose, same keys as Blockbench's Display tab, e.g.
#                   display:
#                     firstperson_righthand: { rotation: [0, -5, 0], translation: [2, 0, 1], scale: [0.6, 0.6, 0.6] }
#                 (overrides whatever the .bbmodel contains; frames inherit it)
#  equip-seconds  draw time, e.g. 1.0 or 2.0: the equip animation is stretched to it and the gun CANNOT fire until
#                 it is over (0 = the clip's own length, or 0.5 s without a clip)
#  casing         ejected casing model (default "casing"); "none" = no casings
#  eject          "right,up,forward" blocks from the eye: where casings pop out
#  arms           per-gun first-person arms (same layout as config.yml arms:), e.g.
#                   arms: { right: { pos: [10.5, 1, 11.5], rotation: [-45, 0, 0] }, left: { enabled: true, pos: [5, 3, 4], rotation: [-45, 0, 22.5] } }
#  SOUNDS         sound keyframes in the .bbmodel (Blockbench "Effects" animator) are exported too: put the .ogg
#                 files in plugins/Firearms/models/sounds/<effect name>.ogg - they play in sync with the clip.
guns:
  pistol:
    name: "&fPistol"
    model: pistol
    weight: 0.9
